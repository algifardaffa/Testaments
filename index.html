        const latestIncreaseVal = document.getElementById('latestIncreaseVal');
        const latestIncreaseSub = document.getElementById('latestIncreaseSub');
        const jokeTierName = document.getElementById('jokeTierName');
        const jokeText = document.getElementById('jokeText');

        function populateDatalist() {
            playerList.innerHTML = '';
            playerNames.forEach(name => {
                const option = document.createElement('option');
                option.value = name;
                playerList.appendChild(option);
            });
        }

        // Fungsi Evaluasi Jokes Berdasarkan Tier Latest Increase
        function getJokeByLatestIncrease(value) {
            if (value <= 0) {
                return {
                    text: "Bruh what did you even do"
                };
            } else if (value > 0 && value <= 50) {
                return {
                    text: "Slow and steady wins the race!"
                };
            } else if (value > 50 && value <= 100) {
                return {
                    text: "Good increase man, keep it up!"
                };
            } else if (value > 100 && value <= 200) {
                return {
                    text: "I bet you lost dozen of dollars for this"
                };
            } else {
                return {
                    text: "I'll definitely report you for cheating"
                };
            }
        }

        function getPlayerSeries(playerName) {
            const data = rawPlayerData[playerName] || [];
            const startIndex = Math.max(0, dates.length - data.length);
            return {
                data,
                startIndex,
                dates: dates.slice(startIndex)
            };
        }

        function populateCompareSelects() {
            // Comparison sekarang memakai search bar seperti Nickname.
            // Datalist playerList sudah berisi seluruh nama player.
            comparePlayer1.value = '';
            comparePlayer2.value = '';
        }

        function getSelectedComparisonPlayers() {
            const values = [comparePlayer1.value.trim(), comparePlayer2.value.trim()];
            return values
                .map(value => playerNames.find(name => name.toLowerCase() === value.toLowerCase()) || '')
                .filter(Boolean)
                .filter((name, index, arr) => arr.indexOf(name) === index && name !== selectedPlayer);
        }

        function parseDateDMY(dateString) {
            const [day, month, year] = dateString.split('/').map(Number);
            return new Date(year, month - 1, day);
        }

        function formatDuration(startDateString, endDateString) {
            const start = parseDateDMY(startDateString);
            const end = parseDateDMY(endDateString);
            const days = Math.max(0, Math.round((end - start) / (1000 * 60 * 60 * 24)));
            const months = Math.floor(days / 30.44);
            const remainingDays = Math.round(days - months * 30.44);
            if (months === 0) return `${days} d.`;
            return remainingDays > 0 ? `${months} mo. ${remainingDays} d.` : `${months} mo.`;
        }

        function getComparisonMetrics(playerName) {
            const data = rawPlayerData[playerName] || [];
            const series = getPlayerSeries(playerName);

            if (data.length === 0) {
                return {
                    name: playerName,
                    latest: null,
                    peak: null,
                    avgGrowth: null,
                    bigIncrease: null,
                    bigDrop: null,
                    lastIncrease: null,
                    joinDuration: "-",
                    totalLme: 0
                };
            }

            const changes = [];
            for (let i = 1; i < data.length; i++) {
                changes.push(data[i] - data[i - 1]);
            }

            const positiveChanges = changes.filter(x => x > 0);
            const avgGrowth = changes.length > 0
                ? changes.reduce((sum, x) => sum + x, 0) / changes.length
                : null;

            return {
                name: playerName,
                latest: data[data.length - 1],
                peak: Math.max(...data),
                avgGrowth: avgGrowth,
                bigIncrease: positiveChanges.length > 0 ? Math.max(...positiveChanges) : 0,
                bigDrop: changes.length > 0 ? Math.min(...changes) : 0,
                lastIncrease: changes.length > 0 ? changes[changes.length - 1] : null,
                joinDuration: series.dates.length > 0
                    ? formatDuration(series.dates[0], series.dates[series.dates.length - 1])
                    : "-",
                totalLme: data.length
            };
        }

        function parseDurationToDays(duration) {
            if (typeof duration !== 'string') return NaN;
            const mo = duration.match(/(\d+)\s*mo\.?/i);
            const d = duration.match(/(\d+)\s*d\.?/i);
            const months = mo ? Number(mo[1]) : 0;
            const days = d ? Number(d[1]) : 0;
            return months * 30 + days;
        }

        function updateComparisonTable(playerNames) {
            const header = document.getElementById('comparisonHeader');
            const body = document.getElementById('comparisonBody');
            if (!header || !body) return;

            const uniquePlayers = [...new Set(playerNames)].filter(name => name && rawPlayerData[name]);
            const metrics = uniquePlayers.map(getComparisonMetrics);

            // Rank asli satu klan berdasarkan damage terakhir seluruh player,
            // bukan rank relatif hanya dari 3 player yang sedang dibandingkan.
            const clanRanking = Object.keys(rawPlayerData)
                .filter(name => name !== '' && rawPlayerData[name] && rawPlayerData[name].length > 0)
                .map(name => ({
                    name,
                    latest: rawPlayerData[name][rawPlayerData[name].length - 1]
                }))
                .sort((a, b) => b.latest - a.latest);

            const rankMap = new Map();
            let previousDamage = null;
            let currentRank = 0;

            clanRanking.forEach((player, index) => {
                if (player.latest !== previousDamage) {
                    currentRank = index + 1;
                    previousDamage = player.latest;
                }
                rankMap.set(player.name, currentRank);
            });

            header.innerHTML = `
                <th class="text-left py-3 px-3 text-slate-400 font-semibold">Attribute</th>
                ${metrics.map((p, i) => `
                    <th class="text-center py-3 px-3 font-bold text-slate-100">
                        ${p.name}
                    </th>
                `).join('')}
            `;

            const rows = [
                { label: 'Rank <span class=\"text-red-400\">#</span>', key: 'rank', format: v => v ? `#${v}` : '-' },
                { label: 'Peak <span class=\"text-blue-400\">⌒</span>', key: 'peak', format: v => v == null ? '-' : v.toLocaleString() },
                { label: 'Average Growth <span class=\"text-yellow-300\">⤴</span>', key: 'avgGrowth', format: v => v == null ? '-' : `${v >= 0 ? '+' : ''}${v.toFixed(1)}` },
                { label: 'Big Increase <span class=\"text-green-400\">↑</span>', key: 'bigIncrease', format: v => v == null ? '-' : `+${v.toLocaleString()}` },
                { label: 'Big Drop <span class=\"text-red-400\">↓</span>', key: 'bigDrop', format: v => v == null ? '-' : `${v >= 0 ? '+' : ''}${v.toLocaleString()}` },
                { label: 'Last Increase <span class=\"text-blue-400\">↻</span>', key: 'lastIncrease', format: v => v == null ? '-' : `${v >= 0 ? '+' : ''}${v.toLocaleString()}` },
                { label: 'Join Duration <span class=\"text-yellow-300\">◷</span>', key: 'joinDuration', format: v => v },
                { label: 'Total LME <span class=\"text-green-400\">●</span>', key: 'totalLme', format: v => v.toLocaleString() }
            ];

            body.innerHTML = rows.map((row, rowIndex) => `
                <tr class="${rowIndex % 2 === 0 ? 'bg-slate-900/20' : ''} border-b border-slate-800/70 last:border-0">
                    <td class="py-3 px-3 text-slate-300 font-medium">${row.label}</td>
                    ${metrics.map(p => {
                        const value = row.key === 'rank' ? rankMap.get(p.name) : p[row.key];
                        const formatted = row.format(value);
                        const values = metrics.map(q => row.key === 'rank' ? rankMap.get(q.name) : q[row.key]);
                        // Join Duration ditampilkan sebagai teks (mis. 2 mo. 15 d.),
                        // tetapi dibandingkan berdasarkan jumlah hari agar tetap bisa diwarnai.
                        const comparableValues = row.key === 'joinDuration'
                            ? values.map(v => parseDurationToDays(v))
                            : values;
                        const nums = comparableValues.filter(v => typeof v === 'number' && !Number.isNaN(v));
                        const comparableValue = row.key === 'joinDuration' ? parseDurationToDays(value) : value;
                        let cls = 'text-slate-100';
                        if (nums.length && typeof comparableValue === 'number' && !Number.isNaN(comparableValue)) {
                            const sorted = [...nums].sort((a, b) => a - b);
                            if (row.key === 'rank') {
                                // Rank terlama? Tidak. Rank terkecil = kualitas terbaik.
                                cls = comparableValue === sorted[0] ? 'text-blue-400 font-bold' : comparableValue === sorted[sorted.length - 1] ? 'text-slate-100 font-bold' : 'text-green-400 font-bold';
                            } else {
                                // Durasi/metric lain: terbesar biru, tengah hijau, terkecil putih.
                                cls = comparableValue === sorted[sorted.length - 1] ? 'text-blue-400 font-bold' : comparableValue === sorted[0] ? 'text-slate-100 font-bold' : 'text-green-400 font-bold';
                            }
                        }
                        return `<td class="py-3 px-3 text-center font-semibold ${cls}">${formatted}</td>`;
                    }).join('')}
                </tr>
            `).join('');
        }

        function updateStatsAndChart() {
            const dataArr = rawPlayerData[selectedPlayer] || [];
            const primarySeries = getPlayerSeries(selectedPlayer);
            const playerDates = primarySeries.dates;



            // 3. Tentukan player pembanding dan rentang tanggal grafik
            const comparisonPlayers = getSelectedComparisonPlayers();
            const allPlayers = [selectedPlayer, ...comparisonPlayers];
            updateComparisonTable(allPlayers);
            const seriesInfo = allPlayers.map(getPlayerSeries);
            const earliestStart = Math.min(...seriesInfo.map(series => series.startIndex));
            const chartDates = dates.slice(earliestStart);

            // 4. Buat dataset dengan null sebelum player mulai muncul.
            const datasets = seriesInfo.map((series, index) => {
                const name = allPlayers[index];
                // Selalu buat array sepanjang chartDates. Nilai sebelum player bergabung
                // dibuat null agar garis baru muncul tepat pada tanggal join.
                const values = Array(chartDates.length).fill(null);
                series.data.forEach((value, i) => {
                    const chartIndex = (series.startIndex - earliestStart) + i;
                    if (chartIndex >= 0 && chartIndex < values.length) {
                        values[chartIndex] = value;
                    }
                });
                const styles = [
                    {
                        borderColor: '#818cf8',
                        backgroundColor: 'rgba(129, 140, 248, 0.15)'
                    },
                    {
                        borderColor: '#34d399',
                        backgroundColor: 'rgba(52, 211, 153, 0.10)'
                    },
                    {
                        borderColor: '#f59e0b',
                        backgroundColor: 'rgba(245, 158, 11, 0.10)'
                    }
                ][index];

                return {
                    label: name,
                    data: values,
                    borderColor: styles.borderColor,
                    backgroundColor: styles.backgroundColor,
                    borderWidth: index === 0 ? 3 : 2.5,
                    fill: index === 0,
                    tension: 0.25,
                    pointRadius: series.data.length > 50 ? 2 : 4,
                    pointHoverRadius: 6,
                    pointBackgroundColor: styles.borderColor,
                    spanGaps: false,
                    showLine: true
                };
            });

            // 5. Batas Y mengikuti damage terbesar dari semua player yang dipilih.
            const maxDamage = Math.max(...seriesInfo.flatMap(series => series.data));

            chartTitle.textContent = comparisonPlayers.length > 0
                ? `Testaments Comparison`
                : `Testaments Across LME`;

            if (chartInstance) {
                chartInstance.destroy();
            }

            const ctx = document.getElementById('progressChart').getContext('2d');
            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: chartDates,
                    datasets: datasets
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        mode: 'index',
                        intersect: false,
                    },
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top',
                            labels: {
                                color: '#94a3b8',
                                font: { family: 'Inter', size: 12 }
                            }
                        },
                        tooltip: {
                            backgroundColor: '#1e293b',
                            titleColor: '#f8fafc',
                            bodyColor: '#cbd5e1',
                            borderColor: '#334155',
                            borderWidth: 1,
                            padding: 12,
                            boxPadding: 6,
                            usePointStyle: true,
                            callbacks: {
                                label: function(context) {
                                    if (context.parsed.y === null) return ` ${context.dataset.label}: Not yet in clan`;
                                    return ` ${context.dataset.label}: ${context.parsed.y.toLocaleString()} Testaments`;
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            grid: {
                                color: 'rgba(51, 65, 85, 0.4)',
                                drawBorder: false
                            },
                            ticks: {
                                color: '#64748b',
                                font: { family: 'Inter', size: 11 },
                                maxRotation: 45,
                                autoSkip: true,
                                maxTicksLimit: 15
                            }
                        },
                        y: {
                            grid: {
                                color: 'rgba(51, 65, 85, 0.4)',
                                drawBorder: false
                            },
                            ticks: {
                                color: '#64748b',
                                font: { family: 'Inter', size: 11 }
                            },
                            beginAtZero: false,
                            max: maxDamage
                        }
                    }
                }
            });
        }

        playerSearch.addEventListener('input', (e) => {
            const query = e.target.value.trim();
            const matchedName = playerNames.find(name => name.toLowerCase() === query.toLowerCase());
            
            if (matchedName) {
                selectedPlayer = matchedName;
                populateCompareSelects();
                updateStatsAndChart();
            }
        });

        function handleComparisonInput(inputElement) {
            const query = inputElement.value.trim();

            // Hanya update kalau nickname yang diketik memang ada.
            const matchedName = playerNames.find(
                name => name.toLowerCase() === query.toLowerCase()
            );

            if (query === '' || matchedName) {
                updateStatsAndChart();
            }
        }

        comparePlayer1.addEventListener('input', () => handleComparisonInput(comparePlayer1));
        comparePlayer2.addEventListener('input', () => handleComparisonInput(comparePlayer2));

        window.onload = function() {
            populateDatalist();
            populateCompareSelects();
            playerSearch.value = selectedPlayer;
            updateStatsAndChart();
        };
    </script>
</body>
</html>
