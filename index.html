        const playerList = document.getElementById('playerList');
        const statPlayerName = document.getElementById('statPlayerName');
        const statLatestValue = document.getElementById('statLatestValue');
        const statHighestValue = document.getElementById('statHighestValue');
        const statDataPoints = document.getElementById('statDataPoints');
        const chartTitle = document.getElementById('chartTitle');

        // Mengisi pilihan auto-complete di datalist
        function populateDatalist() {
            playerList.innerHTML = '';
            playerNames.forEach(name => {
                const option = document.createElement('option');
                option.value = name;
                playerList.appendChild(option);
            });
        }

        function updateStatsAndChart() {
            const dataArr = rawPlayerData[selectedPlayer] || [];
            
            
            if (dataArr.length > 0) {
                const latest = Math.min(...dataArr);
                const highest = Math.max(...dataArr);
                statLatestValue.textContent = latest.toLocaleString();
                statHighestValue.textContent = highest.toLocaleString();
                statDataPoints.textContent = dataArr.length;
            } else {
                statLatestValue.textContent = "-";
                statHighestValue.textContent = "-";
                statDataPoints.textContent = "0";
            }

            chartTitle.textContent = `Testaments Across LME`;

            const playerDates = dates.slice(-dataArr.length);

            const datasets = [{
                label: selectedPlayer,
                data: dataArr,
                borderColor: '#818cf8',
                backgroundColor: 'rgba(129, 140, 248, 0.15)',
                borderWidth: 3,
                fill: true,
                tension: 0.25,
                pointRadius: dataArr.length > 50 ? 2 : 4,
                pointHoverRadius: 6,
                pointBackgroundColor: '#818cf8'
            }];

            if (chartInstance) {
                chartInstance.destroy();
            }

            const ctx = document.getElementById('progressChart').getContext('2d');
            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: playerDates,
                    datasets: datasets
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        mode: 'index',
                        intersect: false,
                    },
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top',
                            labels: {
                                color: '#94a3b8',
                                font: { family: 'Inter', size: 12 }
                            }
                        },
                        tooltip: {
                            backgroundColor: '#1e293b',
                            titleColor: '#f8fafc',
                            bodyColor: '#cbd5e1',
                            borderColor: '#334155',
                            borderWidth: 1,
                            padding: 12,
                            boxPadding: 6,
                            usePointStyle: true,
                            callbacks: {
                                label: function(context) {
                                    return ` ${context.parsed.y.toLocaleString()} Testaments`;
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            grid: {
                                color: 'rgba(51, 65, 85, 0.4)',
                                drawBorder: false
                            },
                            ticks: {
                                color: '#64748b',
                                font: { family: 'Inter', size: 11 },
                                maxRotation: 45,
                                autoSkip: true,
                                maxTicksLimit: 15
                            }
                        },
                        y: {
                            grid: {
                                color: 'rgba(51, 65, 85, 0.4)',
                                drawBorder: false
                            },
                            ticks: {
                                color: '#64748b',
                                font: { family: 'Inter', size: 11 }
                            },
                            beginAtZero: false
                        }
                    }
                }
            });
        }

        // Listener saat nama diketik atau dipilih dari rekomendasi pencarian
        playerSearch.addEventListener('input', (e) => {
            const query = e.target.value.trim();
            // Cari nama yang persis sama (case-insensitive)
            const matchedName = playerNames.find(name => name.toLowerCase() === query.toLowerCase());
            
            if (matchedName) {
                selectedPlayer = matchedName;
                updateStatsAndChart();
            }
        });

        window.onload = function() {
            populateDatalist();
            playerSearch.value = selectedPlayer;
            updateStatsAndChart();
        };
